name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 配布物には入らない開発用の依存も含めて、危険度の高いものが無いか見る。
      # ここで落として公開を止めたいわけではないので、結果は表示だけにする。
      - name: Audit dependencies
        run: npm audit --audit-level=high || true

      # GIGA Standard v4 Part I の検査。落ちたら公開しない。
      # 検査に落ちたときは、検査をゆるめるのではなく quality.config.json に
      # 理由を書いて明示的に許可すること。
      - name: Quality gate
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Googleドライブ同期を有効にする場合は、リポジトリの
          # Settings → Secrets and variables → Actions → Variables に
          # VITE_GOOGLE_CLIENT_ID を登録してください（未登録なら同期機能は無効のまま）。
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
