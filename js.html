  // --- Google API Wrapper ---
  async function runGoogleScript(funcName, ...args) {
    const maxRetries = 3;
    let attempt = 0;

    while (attempt < maxRetries) {
      try {
        return await new Promise((resolve, reject) => {
          const timeoutId = setTimeout(() => reject(new Error('Timeout')), 45000);
          google.script.run
            .withSuccessHandler((res) => { clearTimeout(timeoutId); resolve(res); })
            .withFailureHandler((err) => { clearTimeout(timeoutId); reject(err); })
          [funcName](...args);
        });
      } catch (error) {
        attempt++;
        if (attempt >= maxRetries) throw error;
        await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt)));
      }
    }
  }

  function showLoading(show, msg = '読み込み中...') {
    const overlay = document.getElementById('loading-overlay');
    if (overlay) {
      document.getElementById('loading-message').textContent = msg;
      if (show) overlay.classList.remove('d-none');
      else overlay.classList.add('d-none');
    }
  }

  // --- App Flow ---
  async function checkAppState() {
    showLoading(true, 'アプリを起動中...');
    try {
      const state = await runGoogleScript('getAppState');
      if (!state.isInitialized) {
        showLoading(false);
        document.getElementById('setup-screen').classList.remove('d-none');
        document.getElementById('admin-init-area').classList.remove('d-none');
      } else if (!state.hasContent) {
        showLoading(false);
        document.getElementById('setup-screen').classList.remove('d-none');
        document.getElementById('setupTabs').classList.remove('d-none');
      } else {
        await initViewerData();
      }
    } catch (e) {
      console.error(e);
      showLoading(false);
      Swal.fire('エラー', '起動に失敗しました', 'error');
    }
  }

  async function initializeSystem() {

    document.getElementById('setupTabs').classList.remove('d-none');

  async function initViewerData(isNewCreation = false) {
    showLoading(true, '教科書データを一括ダウンロード中...');
    try {
      const data = await runGoogleScript('getInitialData');
      imagesCache = data.imageUrls;
      drawingsCache = data.drawings;
      slideWidth = data.width;
      slideHeight = data.height;
      totalPages = data.totalPages;

      document.getElementById('setup-screen').classList.add('d-none');
      document.getElementById('viewer-screen').classList.remove('d-none');
      document.getElementById('page-nav-area').style.setProperty('display', 'flex', 'important');
      document.getElementById('toolbar-area').style.setProperty('display', 'flex', 'important');
      document.getElementById('total-pages').textContent = totalPages;

      initCanvas();
      showLoading(false);

      // Page Resume
      let startPage = 0;
      if (!isNewCreation) {
        const savedPage = localStorage.getItem(STORAGE_KEY_PAGE);
        if (savedPage) {
          const p = parseInt(savedPage, 10);
          if (!isNaN(p) && p >= 0 && p < totalPages) {
            startPage = p;
          }
        }
      } else {
        localStorage.removeItem(STORAGE_KEY_PAGE);
      }

      loadPageLocal(startPage);
      updateUiState();

    } catch (e) {
      console.error(e);
      showLoading(false);
      Swal.fire('エラー', 'データの読み込みに失敗しました', 'error');
    }
  }

  // --- Canvas Logic ---
  function initCanvas() {
    const canvasEl = document.getElementById('c');
    canvasEl.width = slideWidth;
    canvasEl.height = slideHeight;

    if (canvas) { canvas.dispose(); }

    canvas = new fabric.Canvas('c', {
      isDrawingMode: false,
      width: slideWidth,
      height: slideHeight,
      perPixelTargetFind: true,
      targetFindTolerance: 10
    });

    fabric.Object.prototype.transparentCorners = false;
    fabric.Object.prototype.cornerColor = '#1a73e8';
    fabric.Object.prototype.cornerStyle = 'circle';

    const onCanvasModified = () => {
      if (isLoadingPage) return;
      isDirty = true;
      document.getElementById('save-status').textContent = '保存中...';
      if (autoSaveTimer) clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(() => {
        saveCurrentPage(true);
      }, 3000);
    };

    canvas.on('path:created', onCanvasModified);
    canvas.on('object:modified', onCanvasModified);
    canvas.on('object:added', onCanvasModified);
    canvas.on('object:removed', onCanvasModified);

    // Mouse Down
    canvas.on('mouse:down', function (opt) {
      isMouseDown = true;
      const ptr = canvas.getPointer(opt.e);

      if (currentMode === 'eraser' && opt.target) {
        canvas.remove(opt.target);
        canvas.requestRenderAll();
      } else if (currentMode === 'qr') {
        qrStartPoint = ptr;
        qrRect = new fabric.Rect({
          left: ptr.x, top: ptr.y, width: 0, height: 0,
          fill: 'rgba(0,0,255,0.2)', stroke: 'blue', strokeWidth: 2, selectable: false
        });
        canvas.add(qrRect);
      } else if (['line', 'arrow', 'rect', 'circle'].includes(currentMode)) {
        shapeStartPoint = ptr;
        if (currentMode === 'line') {
          activeShape = new fabric.Line([ptr.x, ptr.y, ptr.x, ptr.y], { stroke: currentColor, strokeWidth: 3 });
        } else if (currentMode === 'arrow') {
          activeShape = new fabric.Line([ptr.x, ptr.y, ptr.x, ptr.y], { stroke: currentColor, strokeWidth: 3 });
        } else if (currentMode === 'rect') {
          activeShape = new fabric.Rect({ left: ptr.x, top: ptr.y, width: 0, height: 0, fill: 'transparent', stroke: currentColor, strokeWidth: 3 });
        } else if (currentMode === 'circle') {
          activeShape = new fabric.Ellipse({ left: ptr.x, top: ptr.y, rx: 0, ry: 0, fill: 'transparent', stroke: currentColor, strokeWidth: 3 });
        }
        canvas.add(activeShape);
      } else if (currentMode === 'text') {
        addText(ptr.x, ptr.y);
        setMode('select');
      } else if (['link-url', 'link-audio'].includes(currentMode)) {
        addLinkObject(ptr.x, ptr.y, currentMode.split('-')[1]);
        setMode('select');
      }
    });

    // Mouse Up
    canvas.on('mouse:up', function () {
      isMouseDown = false;

      if (currentMode === 'qr' && qrRect) {
        const rectData = {
          left: qrRect.left, top: qrRect.top,
          width: qrRect.width * qrRect.scaleX, height: qrRect.height * qrRect.scaleY
        };
        canvas.remove(qrRect);
        qrRect = null;
        qrStartPoint = null;

        if (Math.abs(rectData.width) > 5 || Math.abs(rectData.height) > 5) {
          scanQRCode(rectData);
        }
      } else if (['line', 'arrow', 'rect', 'circle'].includes(currentMode) && activeShape) {
        if (currentMode === 'arrow') {
          const line = activeShape;
          canvas.remove(line);
          addArrow(line.x1, line.y1, line.x2, line.y2);
        }
        activeShape.setCoords();
        canvas.requestRenderAll();
        activeShape = null;
      }
    });

    // Mouse Move
    canvas.on('mouse:move', function (opt) {
      const ptr = canvas.getPointer(opt.e);

      if (isMouseDown && currentMode === 'eraser' && opt.target) {
        canvas.remove(opt.target);
        canvas.requestRenderAll();
      } else if (isMouseDown && currentMode === 'qr' && qrRect) {
        if (ptr.x < qrStartPoint.x) qrRect.set({ left: ptr.x });
        if (ptr.y < qrStartPoint.y) qrRect.set({ top: ptr.y });
        qrRect.set({
          width: Math.abs(ptr.x - qrStartPoint.x),
          height: Math.abs(ptr.y - qrStartPoint.y)
        });
        canvas.requestRenderAll();
      } else if (isMouseDown && activeShape) {
        if (currentMode === 'line' || currentMode === 'arrow') {
          activeShape.set({ x2: ptr.x, y2: ptr.y });
        } else if (currentMode === 'rect') {
          if (ptr.x < shapeStartPoint.x) activeShape.set({ left: ptr.x });
          if (ptr.y < shapeStartPoint.y) activeShape.set({ top: ptr.y });
          activeShape.set({ width: Math.abs(ptr.x - shapeStartPoint.x), height: Math.abs(ptr.y - shapeStartPoint.y) });
        } else if (currentMode === 'circle') {
          if (ptr.x < shapeStartPoint.x) activeShape.set({ left: ptr.x });
          if (ptr.y < shapeStartPoint.y) activeShape.set({ top: ptr.y });
          activeShape.set({ rx: Math.abs(ptr.x - shapeStartPoint.x) / 2, ry: Math.abs(ptr.y - shapeStartPoint.y) / 2 });
        }
        canvas.requestRenderAll();
      }
    });

    // Double Click Handlers
    canvas.on('mouse:dblclick', function (opt) {
      if (!opt.target) return;

      if (opt.target.linkType) {
        if (opt.target.linkType === 'url') {
          window.open(opt.target.linkTarget, '_blank');
        } else if (opt.target.linkType === 'audio') {
          if (audioPlayer && !audioPlayer.paused) {
            audioPlayer.pause();
            audioPlayer = null;
          } else {
            audioPlayer = new Audio(opt.target.linkTarget);
            audioPlayer.play();
            audioPlayer.onended = () => { audioPlayer = null; };
          }
        }
        return;
      }

      if (opt.target.type === 'i-text' || opt.target.type === 'textbox') {
        opt.target.enterEditing();
        opt.target.selectAll();
      }
    });

    resizeViewer();
  }

  // --- QR Logic ---
  async function scanQRCode(rect) {
    showLoading(true, 'QRコードを解析中...');
    try {
      const base64 = await runGoogleScript('getPageImageBase64', currentPage);
      if (!base64) throw new Error('背景画像が見つかりません');

      const img = new Image();
      img.src = base64;
      await new Promise(r => { img.onload = r; });

      const memCanvas = document.createElement('canvas');
      memCanvas.width = img.width;
      memCanvas.height = img.height;
      const ctx = memCanvas.getContext('2d');
      ctx.drawImage(img, 0, 0);

      const scaleX = img.width / slideWidth;
      const scaleY = img.height / slideHeight;
      const padding = 100; // Wider scan area

      let sx = (rect.left * scaleX) - padding;
      let sy = (rect.top * scaleY) - padding;
      let sw = (rect.width * scaleX) + (padding * 2);
      let sh = (rect.height * scaleY) + (padding * 2);

      if (sx < 0) sx = 0;
      if (sy < 0) sy = 0;
      if (sx + sw > img.width) sw = img.width - sx;
      if (sy + sh > img.height) sh = img.height - sy;

      let imageData = ctx.getImageData(sx, sy, sw, sh);
      let code = jsQR(imageData.data, imageData.width, imageData.height);

      // Fallback: Scan full image
      if (!code) {
        imageData = ctx.getImageData(0, 0, img.width, img.height);
        code = jsQR(imageData.data, imageData.width, imageData.height);
      }

      showLoading(false);

      if (code) {
        const win = window.open(code.data, '_blank');
        setMode('select'); // Auto reset mode

        if (win) {
          const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true });
          Toast.fire({ icon: 'success', title: 'リンクを開きました' });
        } else {
          Swal.fire({
            title: '読み取り成功',
            text: '自動で開けませんでした。ボタンを押して開いてください。',
            icon: 'success',
            confirmButtonText: 'リンクを開く',
            confirmButtonColor: '#1a73e8'
          }).then((result) => {
            if (result.isConfirmed) window.open(code.data, '_blank');
          });
        }
      } else {
        Swal.fire('読み取れませんでした', 'QRコードが鮮明でない可能性があります', 'warning');
      }
    } catch (e) {
      showLoading(false);
      console.error(e);
      Swal.fire('エラー', '読み取りに失敗しました', 'error');
    }
  }

  // --- Zoom & Layout ---
  function resizeViewer() {
    const container = document.getElementById('main-container');
    if (!container) return;
    const availWidth = container.clientWidth;
    const availHeight = container.clientHeight;
    const scaleX = availWidth / slideWidth;
    const scaleY = availHeight / slideHeight;
    baseScale = Math.min(scaleX, scaleY) * 0.98;
    updateTransform();
  }

  function updateTransform() {
    const wrapper = document.getElementById('canvas-wrapper');
    if (!wrapper) return;
    const finalScale = baseScale * userZoom;
    wrapper.style.width = `${slideWidth}px`;
    wrapper.style.height = `${slideHeight}px`;
    wrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${finalScale})`;
  }

  function adjustZoom(delta) {
    userZoom += delta;
    if (userZoom < 1.0) { userZoom = 1.0; resetPan(); }
    if (userZoom > 5.0) userZoom = 5.0;
    updateTransform();
  }
  function resetZoom() { userZoom = 1.0; resetPan(); updateTransform(); }
  function resetPan() { panX = 0; panY = 0; }

  // --- Gesture ---
  const viewer = document.getElementById('main-container');
  viewer.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      isPinching = true;
      const t1 = e.touches[0];
      const t2 = e.touches[1];
      lastTouchDist = Math.hypot(t2.pageX - t1.pageX, t2.pageY - t1.pageY);
      lastTouchCenter = { x: (t1.pageX + t2.pageX) / 2, y: (t1.pageY + t2.pageY) / 2 };
      e.preventDefault();
    }
  }, { passive: false });

  viewer.addEventListener('touchmove', (e) => {
    if (isPinching && e.touches.length === 2) {
      e.preventDefault();
      const t1 = e.touches[0];
      const t2 = e.touches[1];
      const currentDist = Math.hypot(t2.pageX - t1.pageX, t2.pageY - t1.pageY);
      const newZoom = userZoom * (currentDist / lastTouchDist);
      if (newZoom >= 1.0 && newZoom <= 5.0) userZoom = newZoom;
      const currentCenter = { x: (t1.pageX + t2.pageX) / 2, y: (t1.pageY + t2.pageY) / 2 };
      panX += currentCenter.x - lastTouchCenter.x;
      panY += currentCenter.y - lastTouchCenter.y;
      lastTouchDist = currentDist;
      lastTouchCenter = currentCenter;
      updateTransform();
    }
  }, { passive: false });

  viewer.addEventListener('touchend', (e) => {
    if (e.touches.length < 2) {
      isPinching = false;
      if (userZoom < 1.05) resetZoom();
    }
  });

  // --- Import Tools ---
  async function handlePdfSelect(input) {
    if (input.files.length === 0) return;
    const file = input.files[0];
    const fileReader = new FileReader();

    document.getElementById('setupTabs').classList.add('d-none');
    document.getElementById('progress-area').classList.remove('d-none');

    fileReader.onload = async function () {
      try {
        const typedarray = new Uint8Array(this.result);
        const pdf = await pdfjsLib.getDocument(typedarray).promise;
        const numPages = pdf.numPages;
        const page1 = await pdf.getPage(1);
        const viewport1 = page1.getViewport({ scale: 1.5 });

        await runGoogleScript('initPresentationConfig', viewport1.width, viewport1.height);

        for (let i = 1; i <= numPages; i++) {
          updateProgress(i, numPages);
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale: 1.5 });
          const canvasEl = document.createElement('canvas');
          canvasEl.width = viewport.width;
          canvasEl.height = viewport.height;
          await page.render({ canvasContext: canvasEl.getContext('2d'), viewport: viewport }).promise;
          const base64 = canvasEl.toDataURL('image/jpeg', 0.6);
          await runGoogleScript('appendSlidePage', base64, i - 1);
          await new Promise(r => setTimeout(r, 500));
        }

        // Smooth Transition
        await initViewerData(true);
        const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true });
        Toast.fire({ icon: 'success', title: '準備ができました！' });

      } catch (e) {
        Swal.fire('Error', e.message, 'error');
        location.reload();
      }
    };
    fileReader.readAsArrayBuffer(file);
  }

  function addStampToCanvas(stamp) {
    setMode('select');
    const center = canvas.getCenter();
    let stampObject;

    if (stamp.type === 'math') {
      stampObject = createMathShape(stamp.subtype, center.left, center.top);
    } else if (stamp.type === 'my-stamp') {
      const renderSize = 150;
      const displayScale = 0.2;
      const textObj = new fabric.Text(stamp.text, { fontSize: renderSize, fill: stamp.color, fontFamily: 'Zen Maru Gothic', originX: 'center', originY: 'center' });
      let shapeObj = null;
      const padding = 20;
      if (stamp.shape !== 'none') {
        const w = textObj.width + padding * 2;
        const h = textObj.height + padding * 2;
        const size = Math.max(w, h);
        if (stamp.shape === 'circle') shapeObj = new fabric.Circle({ radius: size / 2, fill: '', stroke: stamp.color, strokeWidth: 10, originX: 'center', originY: 'center' });
        else if (stamp.shape === 'square') shapeObj = new fabric.Rect({ width: w, height: h, fill: '', stroke: stamp.color, strokeWidth: 10, originX: 'center', originY: 'center' });
        else if (stamp.shape === 'cloud') shapeObj = new fabric.Rect({ width: w, height: h, rx: 50, ry: 50, fill: '', stroke: stamp.color, strokeWidth: 10, strokeDashArray: [20, 10], originX: 'center', originY: 'center' });
      }
      if (shapeObj) {
        stampObject = new fabric.Group([shapeObj, textObj], { left: center.left, top: center.top, scaleX: displayScale, scaleY: displayScale, originX: 'center', originY: 'center' });
      } else {
        textObj.set({ left: center.left, top: center.top, scaleX: displayScale, scaleY: displayScale });
        stampObject = textObj;
      }
    } else {
      const renderSize = 150;
      const displayScale = 0.2;
      const content = stamp.type === 'vertical' ? stamp.text : stamp.icon;
      stampObject = new fabric.Text(content, { left: center.left, top: center.top, fontSize: renderSize, scaleX: displayScale, scaleY: displayScale, fill: stamp.color, originX: 'center', originY: 'center', textAlign: 'center', lineHeight: 1.1, fontFamily: 'Zen Maru Gothic' });
      if (stamp.type === 'vertical') stampObject.set({ backgroundColor: 'rgba(255,255,255,0.8)' });
    }

    if (stampObject) {
      canvas.add(stampObject);
      canvas.setActiveObject(stampObject);
      canvas.requestRenderAll();
    }
  }

  function createMathShape(subtype, x, y) {
    const yellow = '#ffeb3b'; const stroke = '#666';
    if (subtype === 'block-1') { return new fabric.Rect({ left: x, top: y, width: 30, height: 30, fill: yellow, stroke: stroke, strokeWidth: 2, originX: 'center', originY: 'center' }); }
    else if (subtype === 'block-10') { const grp = [new fabric.Rect({ width: 30, height: 300, fill: yellow, stroke: stroke, strokeWidth: 2 })]; for (let i = 1; i < 10; i++) grp.push(new fabric.Line([0, i * 30, 30, i * 30], { stroke: stroke, strokeWidth: 1 })); return new fabric.Group(grp, { left: x, top: y, originX: 'center', originY: 'center', scaleX: 0.5, scaleY: 0.5 }); }
    else if (subtype === 'block-100') { const rect = new fabric.Rect({ width: 300, height: 300, fill: yellow, stroke: stroke, strokeWidth: 2 }); const lines = [rect]; for (let i = 1; i < 10; i++) { lines.push(new fabric.Line([0, i * 30, 300, i * 30], { stroke: stroke, strokeWidth: 1 })); lines.push(new fabric.Line([i * 30, 0, i * 30, 300], { stroke: stroke, strokeWidth: 1 })); } return new fabric.Group(lines, { left: x, top: y, originX: 'center', originY: 'center', scaleX: 0.3, scaleY: 0.3 }); }
    else if (subtype === 'block-1000') { const size = 100; const offset = 30; const front = new fabric.Rect({ left: 0, top: offset, width: size, height: size, fill: yellow, stroke: stroke, strokeWidth: 2 }); const top = new fabric.Polygon([{ x: 0, y: offset }, { x: offset, y: 0 }, { x: size + offset, y: 0 }, { x: size, y: offset }], { fill: '#fdd835', stroke: stroke, strokeWidth: 2 }); const side = new fabric.Polygon([{ x: size, y: offset }, { x: size + offset, y: 0 }, { x: size + offset, y: size }, { x: size, y: size + offset }], { fill: '#fbc02d', stroke: stroke, strokeWidth: 2 }); return new fabric.Group([front, top, side], { left: x, top: y, originX: 'center', originY: 'center', scaleX: 0.8, scaleY: 0.8 }); }
    else if (subtype === 'place-value') { const w = 300; const h = 150; const bg = new fabric.Rect({ width: w, height: h, fill: 'white', stroke: 'black', strokeWidth: 2 }); const grp = [bg, new fabric.Line([w / 4, 0, w / 4, h], { stroke: 'black' }), new fabric.Line([w / 2, 0, w / 2, h], { stroke: 'black' }), new fabric.Line([w * 3 / 4, 0, w * 3 / 4, h], { stroke: 'black' }), new fabric.Line([0, 40, w, 40], { stroke: 'black' })]; const opts = { fontSize: 24, fontFamily: 'Zen Maru Gothic', fill: 'black', top: 8 }; grp.push(new fabric.Text('千', { ...opts, left: w * 0.125 - 12 }), new fabric.Text('百', { ...opts, left: w * 0.375 - 12 }), new fabric.Text('十', { ...opts, left: w * 0.625 - 12 }), new fabric.Text('一', { ...opts, left: w * 0.875 - 12 })); return new fabric.Group(grp, { left: x, top: y, originX: 'center', originY: 'center' }); }
    else if (subtype === 'calc-frame') { const grp = []; const step = 40; for (let i = 0; i < 4; i++) grp.push(new fabric.Line([i * step, 0, i * step, step * 4], { stroke: '#ddd', strokeDashArray: [5, 5] })); for (let i = 0; i < 5; i++) grp.push(new fabric.Line([0, i * step, step * 3, i * step], { stroke: '#ddd', strokeDashArray: [5, 5] })); grp.push(new fabric.Line([0, step * 3, step * 3, step * 3], { stroke: 'black', strokeWidth: 2 })); return new fabric.Group(grp, { left: x, top: y, originX: 'center', originY: 'center', backgroundColor: 'rgba(255,255,255,0.5)' }); }

    // Geometry 2D
    else if (subtype === 'parallelogram') { return new fabric.Polygon([{ x: 20, y: 0 }, { x: 120, y: 0 }, { x: 100, y: 60 }, { x: 0, y: 60 }], { left: x, top: y, fill: '', stroke: 'black', strokeWidth: 2, originX: 'center', originY: 'center' }); }
    else if (subtype === 'rhombus') { return new fabric.Polygon([{ x: 50, y: 0 }, { x: 100, y: 40 }, { x: 50, y: 80 }, { x: 0, y: 40 }], { left: x, top: y, fill: '', stroke: 'black', strokeWidth: 2, originX: 'center', originY: 'center' }); }
    else if (subtype === 'trapezoid') { return new fabric.Polygon([{ x: 30, y: 0 }, { x: 90, y: 0 }, { x: 120, y: 60 }, { x: 0, y: 60 }], { left: x, top: y, fill: '', stroke: 'black', strokeWidth: 2, originX: 'center', originY: 'center' }); }
    else if (subtype === 'pentagon') { return new fabric.Polygon([{ x: 50, y: 0 }, { x: 100, y: 38 }, { x: 81, y: 95 }, { x: 19, y: 95 }, { x: 0, y: 38 }], { left: x, top: y, fill: '', stroke: 'black', strokeWidth: 2, originX: 'center', originY: 'center' }); }
    else if (subtype === 'hexagon') { return new fabric.Polygon([{ x: 25, y: 0 }, { x: 75, y: 0 }, { x: 100, y: 43 }, { x: 75, y: 86 }, { x: 25, y: 86 }, { x: 0, y: 43 }], { left: x, top: y, fill: '', stroke: 'black', strokeWidth: 2, originX: 'center', originY: 'center' }); }

    // Geometry 3D (Wireframe)
    else if (subtype === 'cube') {
      const s = 80; const o = 30;
      const front = new fabric.Rect({ width: s, height: s, fill: '', stroke: 'black', strokeWidth: 2 });
      const top = new fabric.Polygon([{ x: 0, y: s }, { x: o, y: s - o }, { x: s + o, y: s - o }, { x: s, y: s }], { fill: '', stroke: 'black', strokeWidth: 2 });
      const side = new fabric.Polygon([{ x: s, y: s }, { x: s + o, y: s - o }, { x: s + o, y: 2 * s - o }, { x: s, y: 2 * s }], { fill: '', stroke: 'black', strokeWidth: 2 });
      return new fabric.Group([front, top, side], { left: x, top: y, originX: 'center', originY: 'center', scaleX: 0.8, scaleY: 0.8 });
    }
    else if (subtype === 'cuboid') {
      const w = 120, h = 70, d = 30;
      const front = new fabric.Rect({ width: w, height: h, fill: '', stroke: 'black', strokeWidth: 2 });
      const top = new fabric.Polygon([{ x: 0, y: 0 }, { x: d, y: -d }, { x: w + d, y: -d }, { x: w, y: 0 }], { fill: '', stroke: 'black', strokeWidth: 2 });
      const side = new fabric.Polygon([{ x: w, y: 0 }, { x: w + d, y: -d }, { x: w + d, y: h - d }, { x: w, y: h }], { fill: '', stroke: 'black', strokeWidth: 2 });
      return new fabric.Group([front, top, side], { left: x, top: y, originX: 'center', originY: 'center', scaleX: 0.8, scaleY: 0.8 });
    }
    else if (subtype === 'cylinder') {
      const w = 60, h = 80;
      const e1 = new fabric.Ellipse({ rx: w / 2, ry: 10, fill: '', stroke: 'black', strokeWidth: 2, top: 0 });
      const e2 = new fabric.Ellipse({ rx: w / 2, ry: 10, fill: '', stroke: 'black', strokeWidth: 2, top: h });
      const l1 = new fabric.Line([0, 10, 0, h + 10], { stroke: 'black', strokeWidth: 2 });
      const l2 = new fabric.Line([w, 10, w, h + 10], { stroke: 'black', strokeWidth: 2 });
      return new fabric.Group([e1, e2, l1, l2], { left: x, top: y, originX: 'center', originY: 'center' });
    }

    // Tools
    else if (subtype === 'triangle-ruler') {
      // 45 degree set square
      return new fabric.Polygon([{ x: 0, y: 100 }, { x: 100, y: 100 }, { x: 0, y: 0 }], { left: x, top: y, fill: 'rgba(255,255,255,0.5)', stroke: 'black', strokeWidth: 2, originX: 'center', originY: 'center' });
    }

    return null;
  }

  // --- Mode Logic ---
  function clearPage() {
    Swal.fire({
      title: 'ページをクリア',
      text: "このページの書き込みをすべて消しますか？",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#3085d6',
      confirmButtonText: '消去する',
      cancelButtonText: 'キャンセル'
    }).then((result) => {
      if (result.isConfirmed) {
        canvas.clear();
        saveCurrentPage(true);
        Swal.fire({ icon: 'success', title: '消去しました', timer: 1000, showConfirmButton: false });
        setMode(currentMode);
      }
    });
  }

  function updateUiState() {
    document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
    const toolBtn = document.querySelector(`button[onclick="setMode('${currentMode}')"]`);
    if (toolBtn) toolBtn.classList.add('active');

    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    const colorBtn = document.querySelector(`.color-btn[onclick="setColor('${currentColor}')"]`);
    if (colorBtn) colorBtn.classList.add('active');

    if (['line', 'arrow', 'rect', 'circle'].includes(currentMode)) {
      document.getElementById('shapeDropdown').classList.add('active');
    } else {
      document.getElementById('shapeDropdown').classList.remove('active');
    }
  }

  function setMode(mode) {
    currentMode = mode;
    updateUiState();
    canvas.isDrawingMode = false;
    canvas.selection = false;

    if (mode === 'eraser') {
      canvas.defaultCursor = 'crosshair';
      canvas.hoverCursor = 'crosshair';
    } else if (mode === 'select') {
      canvas.selection = true;
      canvas.defaultCursor = 'default';
      canvas.hoverCursor = 'move';
      canvas.forEachObject(o => o.selectable = true);
    } else if (mode === 'qr') {
      canvas.defaultCursor = 'crosshair';
      canvas.hoverCursor = 'crosshair';
      Swal.fire({ toast: true, position: 'top', icon: 'info', title: 'QR読み取りモード', text: 'QRコードを囲んでください', showConfirmButton: false, timer: 3000 });
    } else if (mode === 'text' || mode === 'line' || mode === 'arrow' || mode === 'rect' || mode === 'circle' || mode === 'link-url' || mode === 'link-audio') {
      canvas.defaultCursor = 'crosshair';
      canvas.hoverCursor = 'crosshair';
    } else {
      canvas.isDrawingMode = true;
      canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
      canvas.defaultCursor = 'default';
      applyBrushSettings();
    }
  }

  function setColor(color) {
    currentColor = color;
    updateUiState();
    applyBrushSettings();
  }

  function applyBrushSettings() {
    if (!canvas.isDrawingMode) return;
    if (currentMode === 'highlighter') {
      canvas.freeDrawingBrush.width = 20;
      const r = parseInt(currentColor.slice(1, 3), 16);
      const g = parseInt(currentColor.slice(3, 5), 16);
      const b = parseInt(currentColor.slice(5, 7), 16);
      canvas.freeDrawingBrush.color = `rgba(${r}, ${g}, ${b}, 0.3)`;
    } else if (currentMode === 'pencil') {
      canvas.freeDrawingBrush.width = 3;
      canvas.freeDrawingBrush.color = currentColor;
    }
  }

  // --- Navigation & Listeners ---
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight') changePage(1);
    else if (e.key === 'ArrowLeft') changePage(-1);
    else if (e.key === 'Delete' || e.key === 'Backspace') {
      const activeObjects = canvas.getActiveObjects();
      if (activeObjects.length > 0) {
        canvas.discardActiveObject();
        activeObjects.forEach((obj) => { canvas.remove(obj); });
        canvas.requestRenderAll();
        e.preventDefault();
      }
    }
  });

  let tStartX = 0; let tStartY = 0;
  window.addEventListener('touchstart', (e) => { if (e.touches.length === 1) { tStartX = e.changedTouches[0].screenX; tStartY = e.changedTouches[0].screenY; } }, { passive: false });
  window.addEventListener('touchend', (e) => { if (e.changedTouches.length === 1 && userZoom <= 1.05 && !isPinching) { const dx = e.changedTouches[0].screenX - tStartX; const dy = e.changedTouches[0].screenY - tStartY; if (Math.abs(dx) > 50 && Math.abs(dy) < 100) changePage(dx < 0 ? 1 : -1); } }, { passive: false });

  // --- Timer Logic ---
  function toggleTimerPanel() {
    const panel = document.getElementById('timer-panel');
    document.getElementById('stamp-panel').classList.remove('open');
    panel.classList.toggle('open');
  }
  function updateCdDisplay() {
    const m = Math.floor(cdTimeLeft / 60).toString().padStart(2, '0');
    const s = (cdTimeLeft % 60).toString().padStart(2, '0');
    document.getElementById('cd-display').textContent = `${m}:${s}`;
  }
  function addTime(seconds) {
    if (seconds === -100) { cdTimeLeft = 0; }
    else { cdTimeLeft += seconds; }
    if (cdTimeLeft < 0) cdTimeLeft = 0;
    updateCdDisplay();
  }
  function toggleCountdown() {
    const btn = document.getElementById('cd-start-btn');
    const display = document.getElementById('cd-display');
    if (isCdRunning) {
      clearInterval(countdownInterval);
      isCdRunning = false;
      btn.innerHTML = '<i class="bi bi-play-fill"></i> スタート';
      btn.classList.replace('btn-warning', 'btn-primary');
      display.classList.remove('timer-flash');
    } else {
      if (cdTimeLeft <= 0) return;
      playBeep(0, 0);
      isCdRunning = true;
      btn.innerHTML = '<i class="bi bi-pause-fill"></i> ストップ';
      btn.classList.replace('btn-primary', 'btn-warning');
      display.classList.remove('timer-flash');

      countdownInterval = setInterval(() => {
        cdTimeLeft--;
        updateCdDisplay();
        if (cdTimeLeft <= 0) {
          clearInterval(countdownInterval);
          isCdRunning = false;
          btn.innerHTML = '<i class="bi bi-play-fill"></i> スタート';
          btn.classList.replace('btn-warning', 'btn-primary');
          display.classList.add('timer-flash');
          playBeep(3, 800);
        }
      }, 1000);
    }
  }
  function resetCountdown() {
    clearInterval(countdownInterval);
    isCdRunning = false;
    cdTimeLeft = 300;
    updateCdDisplay();
    document.getElementById('cd-start-btn').innerHTML = '<i class="bi bi-play-fill"></i> スタート';
    document.getElementById('cd-start-btn').classList.replace('btn-warning', 'btn-primary');
    document.getElementById('cd-display').classList.remove('timer-flash');
  }
  function updateSwDisplay() {
    const m = Math.floor(swElapsedTime / 60000).toString().padStart(2, '0');
    const s = Math.floor((swElapsedTime % 60000) / 1000).toString().padStart(2, '0');
    document.getElementById('sw-display').textContent = `${m}:${s}`;
  }
  function toggleStopwatch() {
    const btn = document.getElementById('sw-start-btn');
    if (isSwRunning) {
      clearInterval(stopwatchInterval);
      isSwRunning = false;
      btn.innerHTML = '<i class="bi bi-play-fill"></i> スタート';
      btn.classList.replace('btn-warning', 'btn-success');
    } else {
      isSwRunning = true;
      swStartTime = Date.now() - swElapsedTime;
      btn.innerHTML = '<i class="bi bi-pause-fill"></i> ストップ';
      btn.classList.replace('btn-success', 'btn-warning');
      stopwatchInterval = setInterval(() => {
        swElapsedTime = Date.now() - swStartTime;
        updateSwDisplay();
      }, 100);
    }
  }
  function resetStopwatch() {
    clearInterval(stopwatchInterval);
    isSwRunning = false;
    swElapsedTime = 0;
    updateSwDisplay();
    document.getElementById('sw-start-btn').innerHTML = '<i class="bi bi-play-fill"></i> スタート';
    document.getElementById('sw-start-btn').classList.replace('btn-warning', 'btn-success');
  }
  function playBeep(times, freq) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();

    // times=0: サイレント再生（iOS AudioContext ロック解除用）
    if (times <= 0) {
      const buf = ctx.createBuffer(1, 1, 22050);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.start();
      return;
    }

    const beep = (count) => {
      if (count <= 0) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
      osc.stop(ctx.currentTime + 0.5);
      setTimeout(() => beep(count - 1), 600);
    };
    beep(times);
  }
</script>
