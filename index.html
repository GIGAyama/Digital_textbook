<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />

  <!-- ① インストールの合図を「いちばん先に」受け取る。
       Chrome は条件が揃うと即座に beforeinstallprompt を出すため、
       アプリ本体の読み込みより後だと合図を取りこぼし、通信が遅い端末で
       「アプリを入れる」ボタンが出なくなる。だから <head> の最上部に置く。 -->
  <script src="./pwa-install-hook.js"></script>

  <!--
    ② 読み込み先を明示的に絞る（CSP）。
       ライブラリはすべて自分のサイト（'self'）から配っているので、
       外部からスクリプトを読むのは Google のログイン部品だけに限定できる。
       ここを絞っておくと、万一どこかから変なコードを差し込まれても動かない。

       ・script-src   … 自分のサイト＋Googleドライブ連携のログイン部品のみ
       ・connect-src  … Google ドライブ API と、共有に使う PeerJS の中継サーバーのみ
       ・media-src に https: が入っているのは、先生が貼り付けた音声ファイルの
                        URL を再生する機能があるため（貼り先は先生が決める）
       ・style-src の 'unsafe-inline' は、React と fabric.js が要素へ
                        直接 style を書き込むため外せない
  -->
  <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://accounts.google.com;
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      img-src 'self' data: blob:;
      media-src 'self' https: data: blob:;
      connect-src 'self' data: blob: https://www.googleapis.com https://accounts.google.com https://0.peerjs.com wss://0.peerjs.com;
      worker-src 'self' blob:;
      frame-src https://accounts.google.com;
      manifest-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />

  <!-- viewport-fit=cover … ノッチやホームバーの領域まで背景を伸ばすために必須。
       user-scalable=no は付けない。児童も教員も拡大して読めるようにするため。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- 「デジタル教科書」は学校教育法第34条第2項の制度用語なので、名乗らない。
       取り違えを防ぐため、説明文にもはっきり書いておく。 -->
  <meta name="description" content="PDFを読み込んで書き込みができる、先生と子どものための教材プリントアプリ。本アプリは、学校教育法第34条第2項に定める「学習者用デジタル教科書」ではありません。教科書発行者とは関係のない、個人が作成した教材ビューアです。" />
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GIGA school">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="教材プリントメーカー（学習者用デジタル教科書ではありません）">
  <meta property="og:description" content="PDFを読み込んで書き込みができる、先生と子どものための教材プリントアプリ。本アプリは、学校教育法第34条第2項に定める「学習者用デジタル教科書」ではありません。教科書発行者とは関係のない、個人が作成した教材ビューアです。">
  <meta property="og:url" content="https://digital-textbook.giga-school.com/">
  <meta property="og:image" content="https://giga-school.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="GIGA school｜学校で使える Web アプリ">
  <meta name="twitter:card" content="summary_large_image">

  <!-- 書体は自分のところから配る（生成物。node tools/fonts/build-fonts.mjs で作り直す）。
       ここに Google Fonts への link を戻さないこと。学校のフィルタが
       塞ぐと書体が当たらず、塞ぎ方によっては画面そのものが出ない。 -->

  <meta name="theme-color" content="#f59e0b" />
  <!-- 児童用アプリなので配色は固定する（端末のダークモードで色が反転すると混乱する） -->
  <meta name="color-scheme" content="light" />

  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./pwa-512x512.png" />
  <!-- iOS は maskable に対応していないので、専用の四角いアイコンを渡す -->
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="教材メーカー" />

  <title>教材プリントメーカー（学習者用デジタル教科書ではありません）</title>
  <script type="module" crossorigin src="./assets/index-C8bngERA.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Ct7_0sKh.css">
<link rel="manifest" href="./manifest.webmanifest"></head>

<body>
  <div id="root"></div>

  <!-- 利用規約・プライバシーへの行き先。中身は正本の部品
       standards/web/giga-app-links.js（配布物 public/giga-app-links.js）が出す。
       文言も並びも行き先も、あちらで決まっている。手で書かないこと。

       ⚠️ 置き場所の <div data-giga-links> を Chrome.jsx の <Footer> に置かない。
          あのフッターは App.jsx:3014 で {!currentTextbookId && <Footer />} と
          書かれていて、教材を開くと React ごと消える。部品は置き場所を
          一度見つけたら見張りをやめるので、そこへ置くと「教材を 1 回開いたら
          リンクが二度と戻らない」ことになる。
          #root の外に出しておけば React の描き替えに巻きこまれない。

       ⚠️ data-links で「つかいかた」を外してある。このアプリにはまだ
          docs/manual/ が無く、既定のまま出すと行き止まりのリンクになる。
          マニュアルを書いたら、この属性ごと消すこと。 -->
  <script src="./giga-app-links.js" data-links="terms,privacy" defer></script>

</body>

</html>
